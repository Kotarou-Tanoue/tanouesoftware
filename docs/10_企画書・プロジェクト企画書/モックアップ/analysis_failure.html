
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI分析失敗 - ウチミテ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="screen">

            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>AI分析結果</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton"
                            aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose"
                                aria-label="メニューを閉じる">
                                ×
                            </button>

                            <div class="menu-content">

                                <div class="menu-account">

                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>

                                </div>

                                <nav class="menu-nav">

                                    <a href="index.html">ホーム</a>

                                    <a href="analysis_input_building.html">
                                        被害状況分析
                                    </a>

                                    <a href="mypage.html">マイページ</a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>


            <!-- メインコンテンツ -->
            <div class="content failure-page">

                <div class="failure-card">

                    <!-- エラーアイコン -->
                    <div class="failure-icon">
                        !
                    </div>

                    <h2>AI分析に失敗しました</h2>

                    <p class="failure-message">
                        申し訳ありません。<br>
                        入力された情報を正常に分析することができませんでした。
                    </p>

                    <!-- エラーの説明 -->
                    <div class="failure-notice">

                        <strong>考えられる原因</strong>

                        <ul>
                            <li>画像の読み込みに失敗した</li>
                            <li>通信環境が不安定になっている</li>
                            <li>AI分析サービスが一時的に利用できない</li>
                        </ul>

                    </div>

                    <p class="failure-note">
                        入力内容や写真を確認して、もう一度お試しください。
                    </p>

                    <!-- 戻るボタン -->
                    <div class="failure-actions">

                        <a href="analysis_input_damage.html"
                            class="failure-back-button">
                            被害状況入力に戻る
                        </a>

                        <a href="index.html"
                            class="failure-home-button">
                            ホームに戻る
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");

        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            menuButton.style.display = "none";

        });

        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            menuButton.style.display = "flex";

        });

    </script>

</body>

</html>
