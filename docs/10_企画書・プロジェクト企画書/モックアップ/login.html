<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン - ウチミテ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="screen">

            <!-- =========================
                 ヘッダー
                 ========================= -->
            <header class="header">

                <div class="nav">

                    <!-- ハンバーガーメニューボタン -->
                    <button
                        class="menu-button"
                        id="menuButton"
                        aria-label="メニューを開く"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>


                    <!-- ハンバーガーメニュー -->
                    <div class="menu" id="menu">

                        <button
                            class="menu-close"
                            id="menuClose"
                            aria-label="メニューを閉じる"
                        >
                            ×
                        </button>

                        <div class="menu-content">

                            <!-- ログイン -->
                            <div class="menu-account">
                                <a href="login.html" class="login-button">
                                    ログイン
                                </a>
                            </div>

                            <!-- ナビゲーション -->
                            <nav class="menu-nav">

                                <a href="index.html">
                                    ホーム
                                </a>

                                <a href="analysis_input_building.html">
                                    被害状況分析
                                </a>

                                <a href="mypage.html">
                                    マイページ
                                </a>

                            </nav>

                        </div>
                    </div>

                </div>

            </header>


            <!-- =========================
                 ログイン画面
                 ========================= -->
            <section class="login-page">

                <div class="login-card">

                    <h1>ログイン</h1>

                    <p class="description">
                        ウチミテにログインすると、<br>
                        建物情報の登録や分析履歴を利用できます。
                    </p>


                    <!-- LINEログイン -->
                    <a
                        href="index.html"
                        class="line-login-button"
                    >
                        LINEでログイン
                    </a>


                    <p class="login-note">
                        ※ログインしなくても、被害状況の分析など<br>
                        一部の機能を利用できます。
                    </p>


                    <a
                        href="index.html"
                        class="back-link"
                    >
                        ホームに戻る
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- =========================
         ハンバーガーメニュー JavaScript
         ========================= -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");


        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            menuButton.style.display = "none";

        });


        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            menuButton.style.display = "flex";

        });

    </script>

</body>
</html>
