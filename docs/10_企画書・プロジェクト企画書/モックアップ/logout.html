```html
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログアウト - ウチミテ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="screen">

            <!-- ヘッダー -->
            <header class="header">

                <div class="nav">

                    <!-- ハンバーガーメニューボタン -->
                    <button
                        class="menu-button"
                        id="menuButton"
                        aria-label="メニューを開く"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <!-- ハンバーガーメニュー -->
                    <div class="menu" id="menu">

                        <button
                            class="menu-close"
                            id="menuClose"
                            aria-label="メニューを閉じる"
                        >
                            ×
                        </button>

                        <div class="menu-content">

                            <!-- ログアウト前のメニュー -->
                            <div class="menu-account">
                                <a href="logout.html" class="login-button">
                                    ログアウト
                                </a>
                            </div>

                            <!-- ナビゲーション -->
                            <nav class="menu-nav">

                                <a href="index.html">
                                    ホーム
                                </a>

                                <a href="analysis_input_building.html">
                                    被害状況分析
                                </a>

                                <a href="mypage.html">
                                    マイページ
                                </a>

                            </nav>

                        </div>
                    </div>

                </div>

            </header>


            <!-- ログアウト確認画面 -->
            <section class="logout-page">

                <div class="logout-card">

                    <h1>ログアウト</h1>

                    <p class="description">
                        ログアウトしてもよろしいですか？
                    </p>

                    <p class="logout-note">
                        ログアウトすると、ログインが必要な機能を<br>
                        利用するには再度ログインが必要になります。
                    </p>

                    <!-- 確認ボタン -->
                    <button
                        type="button"
                        class="logout-confirm-button"
                        id="logoutConfirm"
                    >
                        ログアウトする
                    </button>

                    <!-- キャンセルボタン -->
                    <button
                        type="button"
                        class="logout-cancel-button"
                        id="logoutCancel"
                    >
                        キャンセル
                    </button>

                </div>

            </section>

        </div>

    </main>


    <!-- JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");

        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");
            menuButton.style.display = "none";

        });

        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");
            menuButton.style.display = "flex";

        });

        // ログアウト確認
        document.getElementById("logoutConfirm")
            .addEventListener("click", function () {

                // ホーム画面へ戻る
                window.location.href = "index.html";

            });

        // キャンセル
        document.getElementById("logoutCancel")
            .addEventListener("click", function () {

                // 前の画面に戻る
                if (
                    document.referrer &&
                    new URL(document.referrer).origin === window.location.origin &&
                    new URL(document.referrer).pathname !== window.location.pathname
                ) {

                    window.location.href = document.referrer;

                } else {

                    // 前の画面が取得できない場合はトップ画面へ戻る
                    window.location.href = "index.html";

                }

            });

    </script>

</body>

</html>
```
