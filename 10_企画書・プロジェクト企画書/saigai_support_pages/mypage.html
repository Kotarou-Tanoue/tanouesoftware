<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マイページ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="screen">

            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>マイページ</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>


                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>


                            <div class="menu-content">

                                <div class="menu-account">
                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>
                                </div>


                                <nav class="menu-nav">

                                    <a href="index.html">
                                        ホーム
                                    </a>

                                    <a href="analysis_input_building.html">
                                        被害状況入力
                                    </a>

                                    <a href="mypage.html">
                                        マイページ
                                    </a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>


            <!-- メインコンテンツ -->
            <div class="content">


                <!-- 建物一覧 -->
                <section class="mypage-section">

                    <h2>建物一覧</h2>


                    <div class="card">

                        <h3>自宅</h3>

                        <p>一戸建て（築15年）</p>

                        <a href="building_detail.html">
                            建物詳細を見る　›
                        </a>

                    </div>


                    <div class="card">

                        <h3>実家</h3>

                        <p>一戸建て（築25年）</p>

                        <a href="building_detail.html">
                            建物詳細を見る　›
                        </a>

                    </div>


                    <div class="actions">

                        <a class="button" href="building_register.html">
                            ＋ 建物を登録する
                        </a>

                    </div>

                </section>



                <!-- 最近の分析履歴 -->
                <section class="mypage-section">

                    <h2>最近の分析履歴</h2>


                    <div class="history">

                        <img
                            src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=300"
                            alt="室内写真"
                        >

                        <div>

                            <p>2026/04/12 14:32</p>

                            <b>自宅</b>

                            <p>
                                <span class="badge">
                                    中程度の被害
                                </span>
                            </p>

                            <a href="result.html">
                                分析結果を確認する　›
                            </a>

                        </div>

                    </div>


                    <div class="history">

                        <img
                            src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=300"
                            alt="室内写真"
                        >

                        <div>

                            <p>2026/04/10 09:18</p>

                            <b>実家</b>

                            <p>
                                <span class="badge">
                                    軽微な被害
                                </span>
                            </p>

                            <a href="result.html">
                                分析結果を確認する　›
                            </a>

                        </div>

                    </div>


                    <div class="actions">

                        <a class="button" href="history.html">
                            すべての分析履歴を見る
                        </a>
                    </div>

                    <div class="actions">
                        <a class="button" href="analysis_input_building.html">
                            ＋ 新しく分析する
                        </a>
                    </div>

                </section>

            </div>

        </div>

    </main>



    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");


        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            // ハンバーガーボタンを隠す
            menuButton.style.display = "none";

        });


        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            // ハンバーガーボタンを表示
            menuButton.style.display = "flex";

        });

    </script>

</body>

</html>
