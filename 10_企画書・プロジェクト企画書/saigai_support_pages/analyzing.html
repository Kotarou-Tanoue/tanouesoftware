<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被害状況分析</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content {
            padding: 80px 20px 20px;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="screen">

            <header class="header">

                <div class="page-header">
                    <h1>被害状況分析</h1>

                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>

                            <div class="menu-content">

                                <div class="menu-account">
                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>
                                </div>

                                <nav class="menu-nav">
                                    <a href="index.html">ホーム</a>
                                    <a href="analysis_input_building.html">被害状況分析</a>
                                    <a href="mypage.html">マイページ</a>
                                </nav>

                            </div>

                        </div>

                    </div>
                </div>

            </header>


            <div class="content">

                <div class="progress">

                    <div class="loading-icon">
                        🧠
                    </div>

                    <h2>
                        AIが被害状況を分析しています...
                    </h2>

                    <p>
                        しばらくお待ちください。
                    </p>


                    <div class="steps">

                        <div class="success">
                            ✔ 写真の解析中...
                        </div>

                        <div class="success">
                            ✔ 被害状況の分析中...
                        </div>

                        <div class="success">
                            ✔ 必要な情報を整理中...
                        </div>

                    </div>


                    <div class="info">
                        💡 分析には数分かかる場合があります。<br>
                        このページを閉じずにお待ちください。
                    </div>

                    <!-- 確認用リンク -->
                    <div class="actions">
                        <a class="button secondary" href="analysis_additional_chat.html">
                            追加質問チャットを確認する
                        </a>
</div>

                </div>

            </div>

        </div>
    </main>


    <script>
        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");

        menuButton.addEventListener("click", function () {
            menu.classList.add("active");
            menuButton.style.display = "none";
        });

        menuClose.addEventListener("click", function () {
            menu.classList.remove("active");
            menuButton.style.display = "flex";
        });

        // 10秒後に分析結果画面へ移動
        setTimeout(function () {
            window.location.href = "result.html";
        }, 10000);

    </script>

</body>

</html>
