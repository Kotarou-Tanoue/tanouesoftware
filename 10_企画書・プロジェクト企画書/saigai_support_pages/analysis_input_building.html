<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>分析する建物</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="screen">

            <!-- ナビゲーション -->
            <div class="nav">
                <strong>🏠 災害復旧サポートシステム</strong>

                <span>
                    <a href="index.html">ホーム</a>
                    <a href="input.html">被害状況入力</a>
                    <a href="chat.html">AI相談チャット</a>
                    <a href="mypage.html">マイページ</a>
                </span>
            </div>


            <div class="content">

                <h2>🏠 分析する建物</h2>

                <p>
                    被害状況を分析する建物を選択してください。
                </p>


                <!-- Flaskへ送信 -->
                <form action="analysis_input_damage.html">


                    <!-- ========================= -->
                    <!-- 登録済みの建物 -->
                    <!-- ========================= -->

                    <div class="card">

                        <h3>登録済みの建物</h3>

                        <p>
                            登録済みの建物を選択してください。
                        </p>

                        <select id="registered-building" name="building_id"
                            style="width: 100%; padding: 10px; box-sizing: border-box;">

                            <option value="">
                                新しい建物を入力する
                            </option>

                            <option value="1">
                                自宅（戸建て住宅・築15年）
                            </option>

                            <option value="2">
                                実家（戸建て住宅・築30年）
                            </option>

                        </select>

                    </div>

                    <!-- ========================= -->
                    <!-- 新しい建物 -->
                    <!-- ========================= -->
                    <div id="new-building-form">
                        <p>もしくは</p>

                        <div class="card">

                            <h3>新しい建物を入力</h3>

                            <p>
                                新しい建物を分析する場合は、建物情報を入力してください。
                            </p>


                            <!-- 建物名 -->
                            <p>
                                <label for="building-name">
                                    <strong>建物名</strong>
                                </label>
                                <br>

                                <input type="text" id="building-name" name="building_name" placeholder="例：自宅"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">
                            </p>


                            <!-- 建物の種類 -->
                            <p>
                                <label for="building-type">
                                    <strong>建物の種類</strong>
                                </label>
                                <br>

                                <select id="building-type" name="building_type"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">

                                    <option value="">
                                        選択してください
                                    </option>

                                    <option value="detached">
                                        戸建て住宅
                                    </option>

                                    <option value="apartment">
                                        集合住宅
                                    </option>

                                    <option value="other">
                                        その他
                                    </option>

                                </select>
                            </p>


                            <!-- 築年数 -->
                            <p>
                                <label for="building-age">
                                    <strong>築年数</strong>
                                </label>
                                <br>

                                <input type="number" id="building-age" name="building_age" min="0" inputmode="numeric"
                                    placeholder="例：15" style="width: 10%; padding: 10px; box-sizing: border-box;">

                                年
                            </p>


                            <!-- 所在地 -->
                            <p>
                                <strong>所在地</strong>
                            </p>


                            <!-- 都道府県 -->
                            <p>
                                <label for="prefecture">
                                    都道府県
                                </label>
                                <br>

                                <select id="prefecture" name="prefecture"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">

                                    <option value="">
                                        選択してください
                                    </option>

                                    <option value="hokkaido">北海道</option>
                                    <option value="aomori">青森県</option>
                                    <option value="iwate">岩手県</option>
                                    <option value="miyagi">宮城県</option>
                                    <option value="akita">秋田県</option>
                                    <option value="yamagata">山形県</option>
                                    <option value="fukushima">福島県</option>
                                    <option value="ibaraki">茨城県</option>
                                    <option value="tochigi">栃木県</option>
                                    <option value="gunma">群馬県</option>
                                    <option value="saitama">埼玉県</option>
                                    <option value="chiba">千葉県</option>
                                    <option value="tokyo">東京都</option>
                                    <option value="kanagawa">神奈川県</option>
                                    <option value="niigata">新潟県</option>
                                    <option value="toyama">富山県</option>
                                    <option value="ishikawa">石川県</option>
                                    <option value="fukui">福井県</option>
                                    <option value="yamanashi">山梨県</option>
                                    <option value="nagano">長野県</option>
                                    <option value="gifu">岐阜県</option>
                                    <option value="shizuoka">静岡県</option>
                                    <option value="aichi">愛知県</option>
                                    <option value="mie">三重県</option>
                                    <option value="shiga">滋賀県</option>
                                    <option value="kyoto">京都府</option>
                                    <option value="osaka">大阪府</option>
                                    <option value="hyogo">兵庫県</option>
                                    <option value="nara">奈良県</option>
                                    <option value="wakayama">和歌山県</option>
                                    <option value="tottori">鳥取県</option>
                                    <option value="shimane">島根県</option>
                                    <option value="okayama">岡山県</option>
                                    <option value="hiroshima">広島県</option>
                                    <option value="yamaguchi">山口県</option>
                                    <option value="tokushima">徳島県</option>
                                    <option value="kagawa">香川県</option>
                                    <option value="ehime">愛媛県</option>
                                    <option value="kochi">高知県</option>
                                    <option value="fukuoka">福岡県</option>
                                    <option value="saga">佐賀県</option>
                                    <option value="nagasaki">長崎県</option>
                                    <option value="kumamoto">熊本県</option>
                                    <option value="oita">大分県</option>
                                    <option value="miyazaki">宮崎県</option>
                                    <option value="kagoshima">鹿児島県</option>
                                    <option value="okinawa">沖縄県</option>

                                </select>
                            </p>


                            <!-- 市区町村 -->
                            <p>
                                <label for="city">
                                    <strong>市区町村</strong>
                                </label>
                                <br>

                                <input type="text" id="city" name="city" placeholder="例：熊本市西区"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">
                            </p>


                            <!-- 建物を保存 -->
                            <p>
                                <label>
                                    <input type="checkbox" id="save-building" name="save_building" value="1" style="width: auto;">
                                    この建物を保存する
                                </label>
                                <br>
                                <a><small>保存すると、次回以降この建物を選択して分析できるようになります。</small></a>
                            </p>

                        </div>
                        </div>


                        <!-- ========================= -->
                        <!-- ボタン -->
                        <!-- ========================= -->

                        <div class="actions">

                            <a class="button" href="index.html">
                                戻る
                            </a>

                            <button type="submit" class="button" style="color: white">
                                次へ
                            </button>

                        </div>

                </form>
            </div>

        </div>
    </main>


    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->

    <script>

        const registeredBuilding =
            document.getElementById("registered-building");

        const newBuildingForm =
            document.getElementById("new-building-form");


        function toggleBuildingForm() {

            if (registeredBuilding.value === "") {

                // 新しい建物を入力
                newBuildingForm.style.display = "block";

            } else {

                // 登録済み建物を選択
                newBuildingForm.style.display = "none";

            }

        }


        registeredBuilding.addEventListener(
            "change",
            toggleBuildingForm
        );


        // 初期状態
        toggleBuildingForm();

    </script>

</body>

</html>
