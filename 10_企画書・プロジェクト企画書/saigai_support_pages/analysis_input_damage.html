<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被害状況入力</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="screen">

            <!-- ナビゲーション -->
            <div class="nav">
                <strong>🏠 災害復旧サポートシステム</strong>

                <span>
                    <a href="index.html">ホーム</a>
                    <a href="input.html">被害状況入力</a>
                    <a href="chat.html">AI相談チャット</a>
                    <a href="history.html">履歴</a>
                </span>
            </div>

            <div class="content">

                <h2>📄 被害状況の入力</h2>

                <p>
                    建物の内部の写真をアップロードし、
                    いくつかの質問に回答してください。
                </p>

                <form action="analyzing.html">

                    <!-- 質問入力 -->
                    <div class="card">

                        <h4>被害の内容・写真を入力して下さい</h4>

                        <label>被害を受けた部屋・場所</label>

                        <select id="damage-location" onchange="showLocationOtherInput()">
                            <option>和室</option>
                            <option>洋室</option>
                            <option>キッチン</option>
                            <option>浴室</option>
                            <option>トイレ</option>
                            <option>廊下</option>
                            <option>階段</option>
                            <option>ベランダ</option>
                            <option>外壁</option>
                            <option>屋根</option>
                            <option>庭</option>
                            <option>車庫・ガレージ</option>
                            <option>その他</option>
                        </select>

                        <input type="text" id="other-location" placeholder="被害を受けた場所を入力してください" style="display: none;">


                        <label>被害箇所</label>

                        <select id="damage-part" onchange="showDamageOtherInput()">
                            <option>壁</option>
                            <option>床</option>
                            <option>天井</option>
                            <option>その他</option>
                        </select>

                        <input type="text" id="other-part" placeholder="被害箇所を入力してください" style="display: none;">


                        <label>被害の種類</label><!--被害の大きさ 数値などは後で追加-->

                        <select id="damage-type" onchange="showDamageTypeOtherInput()">
                            <option>ひび割れ</option>
                            <option>剥がれ</option>
                            <option>変形</option>
                            <option>破損</option>
                            <option>傾き</option>
                            <option>沈下</option>
                            <option>倒壊</option>
                            <option>その他</option>
                        </select>

                        <input type="text" id="other-damage-type" placeholder="被害の種類を入力してください" style="display: none;">


                        <label>建物内部の写真を登録</label>

                        <div class="upload">
                            📷<br>
                            ここに画像をドラッグ＆ドロップ<br>
                            または

                            <input
                                type="file"
                                accept="image/*"
                                multiple
                            >
                        </div>

                        <p>※複数枚の登録が可能です。</p>

                    </div>

                    <!-- ボタン -->
                    <div class="actions">

                        <button type="submit">
                            🧠 AI分析を開始する　›
                        </button>

                        <a class="button secondary" href="index.html">
                            戻る
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </main>

<script>
    // 被害箇所の「その他」
    function showDamageOtherInput() {
        const select = document.getElementById("damage-part");
        const input = document.getElementById("other-part");

        if (select.value === "その他") {
            input.style.display = "block";
        } else {
            input.style.display = "none";
        }
    }

    // 部屋・場所の「その他」
    function showLocationOtherInput() {
        const select = document.getElementById("damage-location");
        const input = document.getElementById("other-location");

        if (select.value === "その他") {
            input.style.display = "block";
        } else {
            input.style.display = "none";
        }
    }

    // 被害の種類の「その他」
    function showDamageTypeOtherInput() {
        const select = document.getElementById("damage-type");
        const input = document.getElementById("other-damage-type");

        if (select.value === "その他") {
            input.style.display = "block";
        } else {
            input.style.display = "none";
        }
    }
</script>

</body>
</html>
