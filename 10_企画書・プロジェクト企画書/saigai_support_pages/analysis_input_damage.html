<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被害状況分析</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="screen">

            <header class="header">

                <div class="page-header">

                    <h1>被害状況分析</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>


                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>


                            <div class="menu-content">

                                <div class="menu-account">

                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>

                                </div>


                                <nav class="menu-nav">

                                    <a href="index.html">
                                        ホーム
                                    </a>

                                    <a href="analysis_input_building.html">
                                        被害状況分析
                                    </a>

                                    <a href="mypage.html">
                                        マイページ
                                    </a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>

            <div class="content">

                <h2>📄 ステップ２：被害状況の入力</h2>

                <p>
                    建物の内部の写真をアップロードし、
                    いくつかの質問に回答してください。
                </p>

                <form action="analyzing.html">

                    <!-- 被害情報を入力する場所 -->
                    <div class="card">

                        <h4>被害情報を入力</h4>

                        <!-- 被害を受けた部屋・場所 -->
                        <label>被害を受けた部屋・場所</label>

                        <select id="damage-location">
                            <option>和室</option>
                            <option>洋室</option>
                            <option>キッチン</option>
                            <option>浴室</option>
                            <option>トイレ</option>
                            <option>廊下</option>
                            <option>階段</option>
                            <option>ベランダ</option>
                            <option>外壁</option>
                            <option>屋根</option>
                            <option>庭</option>
                            <option>車庫・ガレージ</option>
                            <option>その他(自由入力可)</option>
                        </select>

                        <input
                            type="text"
                            id="other-location"
                            placeholder="被害を受けた場所を入力してください"
                            style="display: none;"
                        >


                        <!-- 被害箇所 -->
                        <label>被害箇所</label>

                        <select id="damage-part">
                            <option>壁</option>
                            <option>床</option>
                            <option>天井</option>
                            <option>その他(自由入力可)</option>
                        </select>

                        <input
                            type="text"
                            id="other-part"
                            placeholder="被害箇所を入力してください"
                            style="display: none;"
                        >


                        <!-- 被害の種類 -->
                        <label>被害の種類</label>

                        <select id="damage-type">
                            <option>ひび割れ</option>
                            <option>剥がれ</option>
                            <option>変形</option>
                            <option>破損</option>
                            <option>傾き</option>
                            <option>沈下</option>
                            <option>倒壊</option>
                            <option>その他(自由入力可)</option>
                        </select>

                        <input
                            type="text"
                            id="other-damage-type"
                            placeholder="被害の種類を入力してください"
                            style="display: none;"
                        >


                        <!-- 被害が発生した時期 -->
                        <label for="damage-timing">この被害は地震の後に発生したものですか？</label>
                        <select id="damage-timing" name="damage-timing">
                            <option value="わからない">わからない</option>
                            <option value="地震の前からあった">地震の前からあった</option>
                            <option value="地震の後に発生した">地震の後に発生した</option>
                        </select>


                        <!-- 写真 -->
                        <label>建物内部の写真を登録</label>

                        <div class="upload">
                            📷
                            <br>
                            ここに画像をドラッグ＆ドロップ
                            <br>
                            または

                            <input
                                type="file"
                                id="damage-photo"
                                accept="image/*"
                                multiple
                            >
                        </div>

                        <p>※複数枚の登録が可能です。</p>

                    </div>


                    <!-- 被害情報を追加 -->
                    <div class="actions">

                        <button type="button" id="add-damage">
                            ＋ この被害情報を追加
                        </button>

                    </div>


                    <!-- 登録済みの被害情報 -->
                    <div class="card">

                        <h4>📋 登録済みの被害情報</h4>

                        <div id="saved-damages">

                            <p id="no-damage">
                                まだ被害情報は登録されていません。
                            </p>

                        </div>

                    </div>

                    <!-- 建物全体の状態についての質問 -->
                    <div class="card">

                        <h4>建物全体の状態について</h4>
                        <p>建物全体の状態について、わかる範囲で回答してください。</p>

                        <label for="door-window-status">ドアや窓は正常に開閉できますか？</label>
                        <select id="door-window-status" name="door-window-status">
                            <option value="未確認">わからない・確認していない</option>
                            <option value="正常に開閉できる">正常に開閉できる</option>
                            <option value="開閉しにくい">開閉しにくい</option>
                            <option value="開閉できない">開閉できない</option>
                        </select>

                        <label for="unusual-noise">建物から普段と違う音がしますか？</label>
                        <select id="unusual-noise" name="unusual-noise">
                            <option value="未確認">わからない・確認していない</option>
                            <option value="ない">いいえ、特にない</option>
                            <option value="ある">はい、ある</option>
                        </select>

                        <label for="building-tilt">建物の傾きや床の傾斜を感じますか？</label>
                        <select id="building-tilt" name="building-tilt">
                            <option value="未確認">わからない・確認していない</option>
                            <option value="感じない">いいえ、特に感じない</option>
                            <option value="感じる">はい、感じる</option>
                        </select>

                        <p class="note">※危険が疑われる場合は、確認のために建物内を歩き回らず、安全な場所へ移動して専門家や自治体に相談してください。</p>

                    </div>


                    <br>


                    <!-- AI分析 -->
                    <div class="actions">

                        <button type="submit">
                            🧠 AI分析を開始する　›
                        </button>

                        <a class="button secondary" href="analysis_input_building">
                            1つ前に戻る
                        </a>

                    </div>

                </form>

            </div>
        </div>
    </main>


    <script>

        // =========================
        // 「その他」の入力欄を表示
        // =========================

        function checkOther(select, input) {

            if (select.value === "その他(自由入力可)") {

                input.style.display = "block";

            } else {

                input.style.display = "none";
                input.value = "";

            }

        }


        // =========================
        // 部屋・場所
        // =========================

        const locationSelect = document.getElementById("damage-location");
        const otherLocation = document.getElementById("other-location");

        locationSelect.addEventListener("change", function () {

            checkOther(locationSelect, otherLocation);

        });


        // =========================
        // 被害箇所
        // =========================

        const partSelect = document.getElementById("damage-part");
        const otherPart = document.getElementById("other-part");

        partSelect.addEventListener("change", function () {

            checkOther(partSelect, otherPart);

        });


        // =========================
        // 被害の種類
        // =========================

        const typeSelect = document.getElementById("damage-type");
        const otherDamageType = document.getElementById("other-damage-type");
        const timingSelect = document.getElementById("damage-timing");

        typeSelect.addEventListener("change", function () {

            checkOther(typeSelect, otherDamageType);

        });


        // =========================
        // 被害情報を追加
        // =========================

        document.getElementById("add-damage").addEventListener("click", function () {

            const savedDamages = document.getElementById("saved-damages");
            const noDamage = document.getElementById("no-damage");


            // 選択された内容を取得
            let location = locationSelect.value;

            let part = partSelect.value;

            let type = typeSelect.value;
            const timing = timingSelect.value;


            // 「その他」の場合は入力された文字を使用
            if (location === "その他") {

                if (otherLocation.value.trim() === "") {

                    alert("被害を受けた場所を入力してください。");
                    return;

                }

                location = otherLocation.value;

            }


            if (part === "その他") {

                if (otherPart.value.trim() === "") {

                    alert("被害箇所を入力してください。");
                    return;

                }

                part = otherPart.value;

            }


            if (type === "その他") {

                if (otherDamageType.value.trim() === "") {

                    alert("被害の種類を入力してください。");
                    return;

                }

                type = otherDamageType.value;

            }


            // 入力内容が有効になったら「未登録」の表示を消す
            if (noDamage) {
                noDamage.remove();
            }


            // 写真の枚数
            const photoInput = document.getElementById("damage-photo");

            const photoCount = photoInput.files.length;


            // 現在何件登録されているか
            const number =
                savedDamages.querySelectorAll(".saved-damage").length + 1;


            // 新しい一覧カードを作成
            const damage = document.createElement("div");

            damage.className = "card saved-damage";


            damage.innerHTML = `
                <strong>被害情報 ${number}</strong>

                <p>
                    📍 場所：${location}<br>
                    🔨 被害箇所：${part}<br>
                    ⚠️ 被害の種類：${type}<br>
                    🕒 発生時期：${timing}<br>
                    📷 写真：${photoCount}枚
                </p>

                <button type="button" class="delete-damage">
                    削除
                </button>
            `;


            // 一覧に追加
            savedDamages.appendChild(damage);


            // 削除ボタン
            damage.querySelector(".delete-damage").addEventListener(
                "click",
                function () {

                    damage.remove();

                    updateDamageNumbers();

                }
            );


            // 入力欄を初期状態に戻す
            locationSelect.selectedIndex = 0;
            partSelect.selectedIndex = 0;
            typeSelect.selectedIndex = 0;
            timingSelect.selectedIndex = 0;


            otherLocation.value = "";
            otherPart.value = "";
            otherDamageType.value = "";


            otherLocation.style.display = "none";
            otherPart.style.display = "none";
            otherDamageType.style.display = "none";


            // 写真をリセット
            photoInput.value = "";

        });


        // =========================
        // 被害情報の番号を振り直す
        // =========================

        function updateDamageNumbers() {

            const damages =
                document.querySelectorAll(".saved-damage");


            damages.forEach(function (damage, index) {

                damage.querySelector("strong").textContent =
                    "被害情報 " + (index + 1);

            });

        }

        //メニュー用JavaScript

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");


        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            // ハンバーガーボタンを隠す
            menuButton.style.display = "none";

        });


        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            // ハンバーガーボタンを表示
            menuButton.style.display = "flex";

        });

    </script>

</body>
</html>
