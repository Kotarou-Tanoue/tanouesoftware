<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI相談チャット | 災害サポート</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .chat-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .chat-header {
            margin-bottom: 24px;
        }

        .chat-header h1 {
            margin-bottom: 8px;
        }

        .chat-box {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 12px;
            padding: 24px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e8f1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: bold;
        }

        .message.user .message-icon {
            background: #e4f5e9;
        }

        .message-content {
            padding: 14px 16px;
            border-radius: 12px;
            background: #f1f3f5;
            line-height: 1.7;
        }

        .message.user .message-content {
            background: #dcecff;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .chat-input-area button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-input-area button:hover {
            background: #1d4ed8;
        }

        .chat-note {
            margin-top: 12px;
            color: #666666;
            font-size: 13px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .suggestions button {
            padding: 8px 12px;
            border: 1px solid #b8c7dd;
            border-radius: 20px;
            background: white;
            color: #24518c;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .chat-box {
                padding: 14px;
            }

            .message {
                max-width: 100%;
            }

            .chat-input-area button {
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">ホーム</a>
            <a href="input.html">被害状況を入力</a>
            <a href="chat.html">AI相談チャット</a>
            <a href="history.html">分析履歴</a>
        </nav>
    </header>

    <main class="chat-container">

        <div class="chat-header">
            <h1>AI相談チャット</h1>
            <p>災害後の不安や疑問について、AIに質問できます。</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message ai">
                <div class="message-icon">AI</div>
                <div class="message-content">
                    こんにちは。災害サポートAIです。<br>
                    被害状況や修理、罹災証明書の申請などについて質問してください。
                </div>
            </div>

        </div>

        <div class="suggestions">
            <button onclick="sendSuggestion('罹災証明書はどうやって申請しますか？')">
                罹災証明書について
            </button>

            <button onclick="sendSuggestion('修理を始める前に何をすればいいですか？')">
                修理前にすること
            </button>

            <button onclick="sendSuggestion('修理費用の目安を教えてください')">
                修理費用について
            </button>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="質問を入力してください..."
                autocomplete="off"
            >
            <button type="submit">送信</button>
        </form>

        <p class="chat-note">
            ※現在は画面確認用のサンプル返答です。実際のAI回答にはAPIとの連携が必要です。
        </p>

    </main>

    <script>
        const chatBox = document.getElementById("chatBox");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");

        // メッセージを画面に追加する
        function addMessage(message, sender) {
            const messageElement = document.createElement("div");
            messageElement.classList.add("message", sender);

            const icon = document.createElement("div");
            icon.classList.add("message-icon");
            icon.textContent = sender === "ai" ? "AI" : "あなた";

            const content = document.createElement("div");
            content.classList.add("message-content");
            content.textContent = message;

            messageElement.appendChild(icon);
            messageElement.appendChild(content);

            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 質問に対するサンプル回答を返す
        function getAIResponse(question) {
            if (question.includes("罹災証明書")) {
                return "罹災証明書は、自治体に申請して被害の程度を証明してもらう書類です。申請方法や必要書類は自治体によって異なるため、お住まいの市区町村の窓口や公式サイトで確認してください。";
            }

            if (question.includes("修理") || question.includes("費用")) {
                return "修理を始める前に、被害箇所の写真を撮影し、被害状況を記録しておくことが大切です。修理費用は被害の程度や工事内容によって異なるため、複数の業者に見積もりを依頼する方法もあります。";
            }

            if (question.includes("写真") || question.includes("撮影")) {
                return "被害箇所を近くから撮影した写真と、部屋全体が分かる写真の両方を残しておくと、被害状況を説明しやすくなります。安全を確認してから撮影してください。";
            }

            return "質問ありがとうございます。現在はサンプル回答を表示しています。実際のシステムでは、AIが質問内容を読み取り、状況に合わせた回答を生成する予定です。";
        }

        // 質問を送信する
        function sendMessage(message) {
            const question = message.trim();

            if (question === "") {
                return;
            }

            addMessage(question, "user");
            userInput.value = "";

            // サンプル回答を表示する
            setTimeout(function () {
                const response = getAIResponse(question);
                addMessage(response, "ai");
            }, 500);
        }

        // フォーム送信時の処理
        chatForm.addEventListener("submit", function (event) {
            event.preventDefault();
            sendMessage(userInput.value);
        });

        // 質問例ボタンを押したときの処理
        function sendSuggestion(question) {
            sendMessage(question);
        }
    </script>

</body>
</html>
