<!DOCTYPE html>

<body>

    <main class="container">
        <div class="screen">

            <!-- ナビゲーション -->
            <div class="nav">
                <strong>🏠 災害復旧サポートシステム</strong>

                <span>
                    <a href="index.html">ホーム</a>
                    <a href="input.html">被害状況入力</a>
                    <a href="chat.html">AI相談チャット</a>
                    <a href="history.html">履歴</a>

            </div>

            <!-- メイン画面 -->
            <section class="hero">

                <h1>
                    地震後の不安を、<br>
                    このシステムでサポートします。

                    AIが被害状況を分析し、復旧に必要な情報を提示します。

                        <a class="input-link" href="input.html">>>AI相談チャットへ</a>
                    </div>

                </div>

                <div class="feature">
                    <span>📋</span>
                    <div class="feature-links">
                        <b>履歴で再確認</b>
                        <a class="input-link" href="input.html">>>履歴へ</a>
                    </div>
                    <p>被害状況を分析した結果の履歴を表示することができます。</p>
                </div>

                一人で悩まず、まずはご相談ください。
