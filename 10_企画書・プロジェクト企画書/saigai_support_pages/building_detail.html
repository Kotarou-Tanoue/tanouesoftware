<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>建物詳細</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="screen">

            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>建物詳細</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>


                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>


                            <div class="menu-content">

                                <div class="menu-account">

                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>

                                </div>


                                <nav class="menu-nav">

                                    <a href="index.html">
                                        ホーム
                                    </a>

                                    <a href="analysis_input_building.html">
                                        被害状況入力
                                    </a>

                                    <a href="mypage.html">
                                        マイページ
                                    </a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>


            <!-- メインコンテンツ -->
            <div class="content">


                <!-- 建物情報 -->
                <section class="building-detail-section">

                    <h2>建物情報</h2>


                    <div class="card">

                        <div class="building-info">

                            <p>
                                <strong>建物名</strong>
                                <br>
                                自宅
                            </p>


                            <p>
                                <strong>建物の種類</strong>
                                <br>
                                戸建て住宅
                            </p>


                            <p>
                                <strong>築年数</strong>
                                <br>
                                15年
                            </p>


                            <p>
                                <strong>所在地</strong>
                                <br>
                                熊本県熊本市西区
                            </p>

                        </div>


                        <div class="actions">

                            <a class="button" href="building_edit.html">
                                建物情報を編集する
                            </a>

                        </div>

                    </div>

                </section>



                <!-- 分析履歴 -->
                <section class="building-detail-section">
                    <h2>分析履歴</h2>

                    <div class="card">
                        <div class="building-detail-history">
                            <img
                                src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=300"
                                alt="室内写真"
                            >

                            <div>
                                <p>2026/04/12 14:32</p>
                                <b>中程度の被害</b>
                                <p>壁・天井などに被害が確認されました。</p>
                                <a href="result.html">分析結果を確認する　›</a>
                            </div>
                        </div>

                        <div class="actions">
                            <a class="button" href="analysis_input_building.html">
                                ＋ 新しく分析する
                            </a>
                        </div>
                    </div>
                </section>

                <!-- 戻る -->
                <div class="actions">

                    <a class="button secondary" href="mypage.html">
                        マイページに戻る
                    </a>

                </div>


            </div>

        </div>

    </main>



    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");


        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            // ハンバーガーボタンを隠す
            menuButton.style.display = "none";

        });


        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            // ハンバーガーボタンを表示
            menuButton.style.display = "flex";

        });

    </script>

</body>

</html>
