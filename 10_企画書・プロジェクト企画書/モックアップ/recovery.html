<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復旧情報</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="screen">

            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>復旧情報</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>


                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>


                            <div class="menu-content">

                                <div class="menu-account">
                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>
                                </div>


                                <nav class="menu-nav">

                                    <a href="index.html">
                                        ホーム
                                    </a>

                                    <a href="analysis_input_building.html">
                                        被害状況分析
                                    </a>

                                    <a href="mypage.html">
                                        マイページ
                                    </a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>

            <div class="content">

                <h2>後ほど制作予定</h2>

                <!-- 移動ボタン -->
                <div class="actions">

                    <a class="button secondary" href="result.html">
                        分析結果に戻る
                    </a>

                    <a class="button" href="history.html">
                        履歴を見る
                    </a>

                </div>

            </div>
        </div>
    </main>

    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");


        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            // ハンバーガーボタンを隠す
            menuButton.style.display = "none";

        });


        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            // ハンバーガーボタンを表示
            menuButton.style.display = "flex";

        });

    </script>

</body>
</html>
