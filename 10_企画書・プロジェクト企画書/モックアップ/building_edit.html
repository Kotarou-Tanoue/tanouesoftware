<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建物編集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="screen">
            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>建物編集</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>

                            <div class="menu-content">

                                <div class="menu-account">
                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>
                                </div>

                                <nav class="menu-nav">

                                    <a href="index.html">
                                        ホーム
                                    </a>

                                    <a href="analysis_input_building.html">
                                        被害状況分析
                                    </a>

                                    <a href="mypage.html">
                                        マイページ
                                    </a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>

            <div class="content">
                <h2>建物編集</h2>

                <div class="card">
                    <form action="building_edit_complete.html">
                        <p>
                            <label for="building-name"><strong>建物名</strong></label><br>
                            <input type="text" id="building-name" name="building-name"
                                   value="自宅" style="width: 100%; padding: 10px; box-sizing: border-box;">
                        </p>

                        <p>
                            <label for="building-type"><strong>建物の種類</strong></label><br>
                            <select id="building-type" name="building-type"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">
                                <option value="detached" selected>戸建て住宅</option>
                                <option value="apartment">集合住宅</option>
                                <option value="other">その他</option>
                            </select>
                        </p>

                        <p>
                            <label for="building-age"><strong>築年数</strong></label><br>
                            <input type="number" id="building-age" name="building-age"
                                   value="15" min="0" inputmode="numeric"
                                   style="width: 10%; padding: 10px; box-sizing: border-box;">
                            <span>年</span>
                        </p>

                        <p>
                            <strong>所在地</strong><br>

                            <label for="prefecture">都道府県</label><br>
                            <select id="prefecture" name="prefecture"
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">
                                <option value="hokkaido">北海道</option>
                                <option value="aomori">青森県</option>
                                <option value="iwate">岩手県</option>
                                <option value="miyagi">宮城県</option>
                                <option value="akita">秋田県</option>
                                <option value="yamagata">山形県</option>
                                <option value="fukushima">福島県</option>
                                <option value="ibaraki">茨城県</option>
                                <option value="tochigi">栃木県</option>
                                <option value="gunma">群馬県</option>
                                <option value="saitama">埼玉県</option>
                                <option value="chiba">千葉県</option>
                                <option value="tokyo">東京都</option>
                                <option value="kanagawa">神奈川県</option>
                                <option value="niigata">新潟県</option>
                                <option value="toyama">富山県</option>
                                <option value="ishikawa">石川県</option>
                                <option value="fukui">福井県</option>
                                <option value="yamanashi">山梨県</option>
                                <option value="nagano">長野県</option>
                                <option value="gifu">岐阜県</option>
                                <option value="shizuoka">静岡県</option>
                                <option value="aichi">愛知県</option>
                                <option value="mie">三重県</option>
                                <option value="shiga">滋賀県</option>
                                <option value="kyoto">京都府</option>
                                <option value="osaka">大阪府</option>
                                <option value="hyogo">兵庫県</option>
                                <option value="nara">奈良県</option>
                                <option value="wakayama">和歌山県</option>
                                <option value="tottori">鳥取県</option>
                                <option value="shimane">島根県</option>
                                <option value="okayama">岡山県</option>
                                <option value="hiroshima">広島県</option>
                                <option value="yamaguchi">山口県</option>
                                <option value="tokushima">徳島県</option>
                                <option value="kagawa">香川県</option>
                                <option value="ehime">愛媛県</option>
                                <option value="kochi">高知県</option>
                                <option value="fukuoka">福岡県</option>
                                <option value="saga">佐賀県</option>
                                <option value="nagasaki">長崎県</option>
                                <option value="kumamoto" selected>熊本県</option>
                                <option value="oita">大分県</option>
                                <option value="miyazaki">宮崎県</option>
                                <option value="kagoshima">鹿児島県</option>
                                <option value="okinawa">沖縄県</option>
                            </select>
                        </p>

                        <p>
                            <label for="city"><strong>市区町村</strong></label><br>
                            <input type="text" id="city" name="city"
                                   value="熊本市西区" style="width: 100%; padding: 10px; box-sizing: border-box;">
                        </p>

                        <div class="actions">
                            <a class="button" href="building_detail.html">戻る</a>
                            <button type="submit" class="button" style="color: white;">更新</button>
                        </div>
                    </form>

                    <br><br>

                    <a class="button" href="building_delete_confilm.html" style="color: red;">この建物を削除する</a>
                </div>
            </div>
        </div>
    </main>


    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");

        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");

            // ハンバーガーボタンを隠す
            menuButton.style.display = "none";

        });

        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");

            // ハンバーガーボタンを表示
            menuButton.style.display = "flex";

        });

    </script>

</body>
</html>
