<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログアウト - ウチミテ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="screen">
            <!-- ログアウト確認ボタン -->
            <form method="POST" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="logout-confirm-button">
                    ログアウトする
                </button>
            </form>

            <!-- キャンセルボタン -->
            <button type="button" class="logout-cancel-button" onclick="window.location.href='{{ url_for("index") }}'">
                キャンセル
            </button>

        </div>

    </main>

</body>

</html>
