<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - ウチミテ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container">
        <div class="screen">
            <!-- =========================
                ログイン画面
                ========================= -->
            <section class="login-page">
                <div class="login-card">
                    <h1>ログイン</h1>

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="flash-messages">
                                {% for message in messages %}
                                    <p class="flash-message">{{ message }}</p>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}

                    <p class="description">
                        ウチミテにログインすると、<br>
                        建物情報の登録や分析履歴を利用できます。
                    </p>

                    <!-- LINEログイン -->
                    <a href="{{ url_for('auth.line_login') }}" class="line-login-button">
                        LINEでログイン
                    </a>

                    <p class="login-note">
                        ※ログインしなくても、被害状況の分析など<br>
                        一部の機能を利用できます。
                    </p>

                    <a href="{{ url_for('index') }}" class="back-link">
                        ホームに戻る
                    </a>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
