<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>開発用テストログイン</title></head>
<body>
<main>
<h1>開発用テストログイン</h1>
<p>ローカル開発専用です。既存のDBユーザーを選択します。</p>
{% if current_user.is_authenticated %}
<p>ログイン中：ユーザー {{ current_user.user_id }}</p>
<form method="post" action="{{ url_for('auth.logout') }}">
{{ form.hidden_tag() }}<button type="submit">ログアウト</button>
</form>
{% else %}<p>未ログインです。</p>{% endif %}
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('dev_auth.login') }}">
{{ form.hidden_tag() }}
<p>{{ form.user_id.label }} {{ form.user_id() }}</p>
<button type="submit">選択したユーザーでログイン</button>
</form>
<p><a href="{{ url_for('index') }}">トップページへ</a></p>
</main>
</body></html>
