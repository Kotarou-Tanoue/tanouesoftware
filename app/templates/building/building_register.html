
{% extends "base.html" %}

{% block title %}建物登録{% endblock %}

{% block heading %}建物登録{% endblock %}

{% block content %}

<h2>建物情報を入力してください</h2>

<div class="card">

    <form action="{{ url_for('building.register') }}" method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- 建物名 -->
        <p>
            <strong>建物名</strong><br>
            <input
                type="text"
                name="building-name"
                placeholder="例：自宅"
                required
            >
        </p>

        <!-- 建物の種類 -->
        <p>
            <strong>建物の種類</strong><br>
            <select name="building-type" required>
                <option value="">選択してください</option>
                <option value="1">戸建て</option>
                <option value="2">集合住宅</option>
            </select>
        </p>

        <!-- 築年数 -->
        <p>
            <strong>築年数</strong><br>
            <input
                type="number"
                name="building-age"
                min="0"
                placeholder="例：15"
                required
                style="width: 10%;"
            >
            年
        </p>

        <!-- 都道府県 -->
        <p>
            <strong>都道府県</strong><br>
            <select name="prefecture" required>
                <option value="">選択してください</option>
                <option>北海道</option>
                <option>青森県</option>
                <option>岩手県</option>
                <option>宮城県</option>
                <option>秋田県</option>
                <option>山形県</option>
                <option>福島県</option>
                <option>茨城県</option>
                <option>栃木県</option>
                <option>群馬県</option>
                <option>埼玉県</option>
                <option>千葉県</option>
                <option>東京都</option>
                <option>神奈川県</option>
                <option>新潟県</option>
                <option>富山県</option>
                <option>石川県</option>
                <option>福井県</option>
                <option>山梨県</option>
                <option>長野県</option>
                <option>岐阜県</option>
                <option>静岡県</option>
                <option>愛知県</option>
                <option>三重県</option>
                <option>滋賀県</option>
                <option>京都府</option>
                <option>大阪府</option>
                <option>兵庫県</option>
                <option>奈良県</option>
                <option>和歌山県</option>
                <option>鳥取県</option>
                <option>島根県</option>
                <option>岡山県</option>
                <option>広島県</option>
                <option>山口県</option>
                <option>徳島県</option>
                <option>香川県</option>
                <option>愛媛県</option>
                <option>高知県</option>
                <option>福岡県</option>
                <option>佐賀県</option>
                <option>長崎県</option>
                <option>熊本県</option>
                <option>大分県</option>
                <option>宮崎県</option>
                <option>鹿児島県</option>
                <option>沖縄県</option>
            </select>
        </p>

        <!-- 市区町村 -->
        <p>
            <strong>市区町村</strong><br>
            <input
                type="text"
                name="city"
                placeholder="例：熊本市西区"
                required
            >
        </p>

        <!-- ボタン -->
        <div class="actions">

            <a href="{{ url_for('mypage.show_mypage') }}" class="button">
                戻る
            </a>

            <button type="submit" class="button">
                登録
            </button>

        </div>

    </form>

</div>

{% endblock %}
