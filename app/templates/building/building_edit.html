
{% extends "base.html" %}

{% block title %}建物編集{% endblock %}

{% block heading %}建物編集{% endblock %}

{% block content %}

<h2>建物編集</h2>

<div class="card">

    <form action="{{ url_for('building.edit', building_id=building.building_id) }}" method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- 建物名 -->
        <p>
            <strong>建物名</strong><br>
            <input
                type="text"
                name="building-name"
                value="{{ building.building_name }}"
                required
            >
        </p>

        <!-- 建物の種類 -->
        <p>
            <strong>建物の種類</strong><br>
            <select name="building-type" required>

                <option value="1" {% if building.building_type_code == 1 %}selected{% endif %}>
                    戸建て
                </option>

                <option value="2" {% if building.building_type_code == 2 %}selected{% endif %}>
                    集合住宅
                </option>

            </select>
        </p>

        <!-- 築年数 -->
        <p>
            <strong>築年数</strong><br>
            <input
                type="number"
                name="building-age"
                value="{{ building_age }}"
                min="0"
                required
                style="width: 10%;"
            >
            年
        </p>

        <!-- 都道府県 -->
        <p>
            <strong>都道府県</strong><br>

            <select name="prefecture" required>

                {% for prefecture in [
                    "北海道", "青森県", "岩手県", "宮城県", "秋田県",
                    "山形県", "福島県", "茨城県", "栃木県", "群馬県",
                    "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県",
                    "富山県", "石川県", "福井県", "山梨県", "長野県",
                    "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県",
                    "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
                    "鳥取県", "島根県", "岡山県", "広島県", "山口県",
                    "徳島県", "香川県", "愛媛県", "高知県", "福岡県",
                    "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県",
                    "鹿児島県", "沖縄県"
                ] %}

                    <option value="{{ prefecture }}"
                        {% if building.prefecture == prefecture %}selected{% endif %}>
                        {{ prefecture }}
                    </option>

                {% endfor %}

            </select>
        </p>

        <!-- 市区町村 -->
        <p>
            <strong>市区町村</strong><br>
            <input
                type="text"
                name="city"
                value="{{ building.city }}"
                required
            >
        </p>

        <!-- ボタン -->
        <div class="actions">

            <a class="button"
                href="{{ url_for('building.detail', building_id=building.building_id) }}">
                戻る
            </a>

            <button type="submit" class="button">
                更新
            </button>

        </div>

    </form>

    <!-- 建物削除 -->
    <br><br>

    <a class="button"
        href="{{ url_for('building.delete_confirm', building_id=building.building_id) }}"
        style="color: red;">
        この建物を削除する
    </a>

</div>

{% endblock %}
