
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建物編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <div class="screen">
            <!-- ヘッダー -->
            <header class="header">

                <div class="page-header">

                    <h1>建物編集</h1>

                    <!-- ハンバーガーメニュー -->
                    <div class="nav">

                        <button class="menu-button" id="menuButton" aria-label="メニューを開く">
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>

                        <!-- メニュー -->
                        <div class="menu" id="menu">

                            <button class="menu-close" id="menuClose" aria-label="メニューを閉じる">
                                ×
                            </button>

                            <div class="menu-content">

                                <div class="menu-account">
                                    <a href="login.html" class="login-button">
                                        ログイン
                                    </a>
                                </div>

                                <nav class="menu-nav">

                                    <a href="index.html">ホーム</a>
                                    <a href="analysis_input_building.html">被害状況分析</a>
                                    <a href="mypage.html">マイページ</a>

                                </nav>

                            </div>

                        </div>

                    </div>

                </div>

            </header>

            <div class="content">
                <h2>建物編集</h2>

                <div class="card">

                    <form action="{{ url_for('building.edit', building_id=building.building_id) }}" method="post">

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <p>
                            <label for="building-name"><strong>建物名</strong></label><br>
                            <input type="text" id="building-name" name="building-name"
                                   value="{{ building.building_name }}"
                                   required
                                   style="width: 100%; padding: 10px; box-sizing: border-box;">
                        </p>

                        <p>
                            <label for="building-type"><strong>建物の種類</strong></label><br>
                            <select id="building-type" name="building-type"
                                    required
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">

                                <option value="1" {% if building.building_type_code == 1 %}selected{% endif %}>
                                    戸建て
                                </option>

                                <option value="2" {% if building.building_type_code == 2 %}selected{% endif %}>
                                    集合住宅
                                </option>

                            </select>
                        </p>

                        <p>
                            <label for="building-age"><strong>築年数</strong></label><br>
                            <input type="number" id="building-age" name="building-age"
                                   value="{{ building_age }}" min="0" inputmode="numeric"
                                   required
                                   style="width: 10%; padding: 10px; box-sizing: border-box;">
                            <span>年</span>
                        </p>

                        <p>
                            <strong>所在地</strong><br>

                            <label for="prefecture">都道府県</label><br>

                            <select id="prefecture" name="prefecture"
                                    required
                                    style="width: 100%; padding: 10px; box-sizing: border-box;">

                                {% for prefecture in [
                                    "北海道", "青森県", "岩手県", "宮城県", "秋田県",
                                    "山形県", "福島県", "茨城県", "栃木県", "群馬県",
                                    "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県",
                                    "富山県", "石川県", "福井県", "山梨県", "長野県",
                                    "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県",
                                    "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
                                    "鳥取県", "島根県", "岡山県", "広島県", "山口県",
                                    "徳島県", "香川県", "愛媛県", "高知県", "福岡県",
                                    "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県",
                                    "鹿児島県", "沖縄県"
                                ] %}

                                    <option value="{{ prefecture }}"
                                        {% if building.prefecture == prefecture %}selected{% endif %}>
                                        {{ prefecture }}
                                    </option>

                                {% endfor %}

                            </select>
                        </p>

                        <p>
                            <label for="city"><strong>市区町村</strong></label><br>
                            <input type="text" id="city" name="city"
                                   value="{{ building.city }}"
                                   required
                                   style="width: 100%; padding: 10px; box-sizing: border-box;">
                        </p>

                        <div class="actions">

                            <a class="button"
                               href="{{ url_for('building.detail', building_id=building.building_id) }}">
                                戻る
                            </a>

                            <button type="submit" class="button" style="color: white;">
                                更新
                            </button>

                        </div>

                    </form>

                    <br><br>

                    <a class="button"
                       href="{{ url_for('building.delete_confirm') }}"
                       style="color: red;">
                        この建物を削除する
                    </a>

                </div>
            </div>
        </div>
    </main>

    <!-- メニュー用JavaScript -->
    <script>

        const menuButton = document.getElementById("menuButton");
        const menu = document.getElementById("menu");
        const menuClose = document.getElementById("menuClose");

        // メニューを開く
        menuButton.addEventListener("click", function () {

            menu.classList.add("active");
            menuButton.style.display = "none";

        });

        // メニューを閉じる
        menuClose.addEventListener("click", function () {

            menu.classList.remove("active");
            menuButton.style.display = "flex";

        });

    </script>

</body>
</html>
