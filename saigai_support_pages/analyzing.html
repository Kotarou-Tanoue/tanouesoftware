<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI分析中</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="screen">

            <!-- ナビゲーション -->
            <div class="nav">
                <strong>🏠 災害復旧サポートシステム</strong>

                <span>
                    <a href="index.html">ホーム</a>
                    <a href="input.html">被害状況入力</a>
                    <a href="history.html">履歴</a>
                </span>
            </div>

            <!-- 分析中の表示 -->
            <div class="progress">

                <div class="loading-icon">
                    🧠
                </div>

                <h2>
                    AIが被害状況を分析しています...
                </h2>

                <p>
                    しばらくお待ちください。
                </p>

                <!-- 分析状況 -->
                <div class="steps">

                    <div class="success">
                        ✔ 写真の解析中...
                    </div>

                    <div class="success">
                        ✔ 被害状況の分析中...
                    </div>

                    <div class="success">
                        ✔ 必要な情報を整理中...
                    </div>

                </div>

                <div class="info">
                    💡 分析には数分かかる場合があります。<br>
                    このページを閉じずにお待ちください。
                </div>

                <!-- 画面確認用ボタン -->
                <a class="button" href="result.html">
                    結果画面を見る（画面確認用）
                </a>

            </div>

        </div>
    </main>

</body>
</html>
